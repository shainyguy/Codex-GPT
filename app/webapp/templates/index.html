<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgentHub Mini App</title>
  <link rel="stylesheet" href="/webapp/static/styles.css" />
</head>
<body>
  <main>
    <h1>AgentHub</h1>
    <input id="token" placeholder="JWT token" />
    <section>
      <h2>Создание агента</h2>
      <input id="name" placeholder="Имя" />
      <input id="provider" value="openai" />
      <input id="model" value="gpt-4o-mini" />
      <textarea id="prompt" placeholder="System prompt"></textarea>
      <button onclick="createAgent()">Создать</button>
    </section>
    <section>
      <h2>Список агентов</h2>
      <button onclick="loadAgents()">Обновить</button>
      <pre id="agents"></pre>
    </section>
    <section>
      <h2>Баланс токенов (WS)</h2>
      <button onclick="connectWs()">Подключить WS</button>
      <pre id="wallets"></pre>
    </section>
  </main>
  <script src="/webapp/static/app.js"></script>
</body>
</html>
