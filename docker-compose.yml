version: '3.9'
services:
  api:
    build: .
    env_file: .env.example
    depends_on:
      - postgres
      - redis
    ports:
      - '8000:8000'
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agenthub
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - '6379:6379'
volumes:
  pgdata:
